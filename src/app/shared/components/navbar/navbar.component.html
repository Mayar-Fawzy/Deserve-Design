<nav class="navbar" [class.scrolled]="isScrolled()" [class.rtl]="langService.isRtl">
  <div class="nav-container">

    <!-- Logo -->
    <a routerLink="/" class="nav-logo" (click)="closeMobile()">
      <div class="logo-img-wrap">
        <img src="asserts/logo.png" alt="Deserve Design" class="logo-img" />
      </div>
      <span class="logo-text">DESERVE<span class="logo-accent">.</span></span>
    </a>

    <!-- Desktop Navigation -->
    <ul class="nav-links">
      @for (link of navLinks; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.exact }"
            class="nav-link"
          >
            {{ link.key | translate }}
          </a>
        </li>
      }
    </ul>

    <!-- Controls -->
    <div class="nav-controls">
      <!-- Language Toggle -->
      <button class="ctrl-btn lang-btn" (click)="langService.toggle()" [title]="langService.currentLang() === 'en' ? 'العربية' : 'English'">
        <span class="lang-label">{{ langService.currentLang() === 'en' ? 'AR' : 'EN' }}</span>
      </button>

      <!-- Theme Toggle -->
      <button class="ctrl-btn theme-btn" (click)="themeService.toggle()" [title]="themeService.isDark() ? 'Light mode' : 'Dark mode'">
        @if (themeService.isDark()) {
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
            <path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.166 17.834a.75.75 0 0 0-1.06 1.06l1.59 1.591a.75.75 0 1 0 1.061-1.06l-1.59-1.591ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.166 6.166a.75.75 0 0 0 1.06 1.06l1.591-1.59a.75.75 0 1 0-1.06-1.061L6.166 6.166Z" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
            <path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z" clip-rule="evenodd" />
          </svg>
        }
      </button>

      <!-- Hamburger -->
      <button class="hamburger" [class.open]="mobileOpen()" (click)="toggleMobile()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="mobileOpen()">
    <ul class="mobile-links">
      @for (link of navLinks; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.exact }"
            class="mobile-link"
            (click)="closeMobile()"
          >
            {{ link.key | translate }}
          </a>
        </li>
      }
    </ul>
  </div>
</nav>
